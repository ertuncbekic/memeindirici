<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sınırsız Meme Arşivi İndirici</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-xl w-full bg-slate-800 p-6 rounded-2xl shadow-2xl border border-slate-700">
        <h1 class="text-2xl font-bold text-center mb-2 text-indigo-400">Ölümsüz Video İndirici</h1>
        <p class="text-slate-400 text-sm text-center mb-6">YouTube, Instagram, TikTok veya X bağlantısını yapıştırın.</p>

        <div class="flex gap-2 mb-6">
            <input type="text" id="videoUrl" placeholder="https://..." 
                   class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl focus:outline-none focus:border-indigo-500 text-sm text-white placeholder-slate-400">
            <button onclick="fetchVideoData()" id="btnFetch" 
                    class="bg-indigo-600 hover:bg-indigo-500 px-6 py-3 rounded-xl font-medium transition duration-200 shrink-0">
                Sorgula
            </button>
        </div>

        <div id="loading" class="hidden text-center py-6 text-indigo-400 font-semibold animate-pulse">
            Sunucu ağları taranıyor, video hazırlanıyor...
        </div>

        <div id="error" class="hidden text-center py-3 px-4 bg-red-900/50 border border-red-500/50 text-red-300 rounded-xl mb-4 text-sm"></div>

        <div id="result" class="hidden space-y-5">
            <div class="flex flex-col sm:flex-row gap-4 items-center bg-slate-700/50 p-4 rounded-xl border border-slate-600">
                <img id="thumb" class="w-full sm:w-36 h-24 object-cover rounded-lg shadow" src="" alt="Thumbnail">
                <div class="w-full">
                    <h3 id="title" class="font-semibold text-sm sm:text-base line-clamp-2 text-slate-100">Video Hazır</h3>
                    <p class="text-xs text-emerald-400 mt-1" id="serverInfo">Bağlantı oluşturuldu.</p>
                </div>
            </div>

            <a id="downloadBtn" href="#" target="_blank" download 
               class="block w-full text-center bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl transition duration-200 shadow-lg shadow-emerald-900/30">
               Hemen İndir
            </a>
        </div>
    </div>

    <script>
        // Çalışan güncel sunucular ve CORS engel kırıcı
        const COBALT_SERVERS = [
            "https://api.cobalt.tools/", 
            "https://api.cobalt.best/",
            "https://corsproxy.io/?" + encodeURIComponent("https://api.cobalt.tools/")
        ];

        function extractYouTubeID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        async function fetchVideoData() {
            const input = document.getElementById('videoUrl').value.trim();
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const result = document.getElementById('result');
            const downloadBtn = document.getElementById('downloadBtn');
            const thumbImg = document.getElementById('thumb');
            const serverInfo = document.getElementById('serverInfo');

            if (!input.startsWith("http")) {
                showError("Lütfen geçerli bir bağlantı girin.");
                return;
            }

            error.classList.add('hidden');
            result.classList.add('hidden');
            loading.classList.remove('hidden');

            const ytId = extractYouTubeID(input);
            if (ytId) {
                thumbImg.src = `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`;
            } else {
                thumbImg.src = 'https://placehold.co/300x200/334155/fff?text=Medya+Hazir';
            }

            let finalDownloadUrl = null;
            let usedServer = "";

            // SUNUCU DÖNGÜSÜ: Biri çökerse (Failed to fetch) diğeri devreye girer
            for (let i = 0; i < COBALT_SERVERS.length; i++) {
                try {
                    const apiUrl = COBALT_SERVERS[i];
                    console.log("Bağlanılıyor:", apiUrl);
                    
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: {
                            'Accept': 'application/json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            url: input,
                            videoQuality: "720"
                        })
                    });

                    // Sunucu hata kodu döndürdüyse (örn: 403, 500) bu sunucuyu es geç
                    if (!response.ok) continue; 

                    const data = await response.json();

                    if (data.url) {
                        finalDownloadUrl = data.url;
                        usedServer = "Yedek Sunucu " + (i + 1);
                        break; // Link başarıyla alındı, döngüden çık!
                    } else if (data.picker && data.picker.length > 0) {
                        finalDownloadUrl = data.picker[0].url;
                        usedServer = "Yedek Sunucu " + (i + 1);
                        break;
                    }

                } catch (err) {
                    console.log("Sunucu yanıt vermedi, sıradakine geçiliyor...");
                    // "Failed to fetch" hatası burada yakalanır ve siteyi çökertmez.
                }
            }

            if (finalDownloadUrl) {
                downloadBtn.href = finalDownloadUrl;
                serverInfo.innerText = usedServer + " ile bağlantı kuruldu.";
                loading.classList.add('hidden');
                result.classList.remove('hidden');
            } else {
                loading.classList.add('hidden');
                showError("Tüm ağlar şu anda meşgul veya video gizli olduğu için erişilemiyor.");
            }
        }

        function showError(msg) {
            const error = document.getElementById('error');
            error.innerText = msg;
            error.classList.remove('hidden');
        }
    </script>
</body>
</html>
