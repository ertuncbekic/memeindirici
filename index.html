<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hepsi Bir Arada Video İndirici</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-xl w-full bg-slate-800 p-6 rounded-2xl shadow-2xl border border-slate-700">
        <h1 class="text-2xl font-bold text-center mb-2 text-indigo-400">Sosyal Medya Video İndirici</h1>
        <p class="text-slate-400 text-sm text-center mb-6">YouTube, Instagram, TikTok, X (Twitter) veya Facebook linkini yapıştırın.</p>

        <!-- Link Giriş Formu -->
        <div class="flex gap-2 mb-6">
            <input type="text" id="videoUrl" placeholder="https://www.instagram.com/reel/... veya YouTube, TikTok, X" 
                   class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl focus:outline-none focus:border-indigo-500 text-sm text-white placeholder-slate-400">
            <button onclick="fetchVideoData()" id="btnFetch" 
                    class="bg-indigo-600 hover:bg-indigo-500 px-6 py-3 rounded-xl font-medium transition duration-200 shrink-0">
                Sorgula
            </button>
        </div>

        <!-- Yükleniyor Uyarısı -->
        <div id="loading" class="hidden text-center py-6 text-indigo-400 font-semibold animate-pulse">
            Bağlantı analiz ediliyor, lütfen bekleyin...
        </div>

        <!-- Hata Uyarısı -->
        <div id="error" class="hidden text-center py-3 px-4 bg-red-900/50 border border-red-500/50 text-red-300 rounded-xl mb-4 text-sm"></div>

        <!-- Sonuç & Önizleme Alanı -->
        <div id="result" class="hidden space-y-5">
            <!-- Video Bilgi Kartı -->
            <div class="flex flex-col sm:flex-row gap-4 items-center bg-slate-700/50 p-4 rounded-xl border border-slate-600">
                <img id="thumb" class="w-full sm:w-36 h-24 object-cover rounded-lg shadow" src="" alt="Thumbnail">
                <div class="w-full">
                    <h3 id="title" class="font-semibold text-sm sm:text-base line-clamp-2 text-slate-100">Medya Bulundu</h3>
                    <p id="platformBadge" class="text-xs text-indigo-300 mt-1 font-medium"></p>
                </div>
            </div>

            <!-- Format Seçim Formu -->
            <div class="bg-slate-700/30 p-4 rounded-xl border border-slate-700/60 space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-2">İNDİRME FORMATI</label>
                    <select id="formatSelect" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl focus:outline-none focus:border-indigo-500 text-sm text-white">
                        <option value="mp4">Video (MP4)</option>
                        <option value="mp3">Müzik / Ses (MP3)</option>
                    </select>
                </div>

                <!-- İndir Butonu -->
                <button onclick="startDownload()" id="btnDownload" 
                        class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-lg shadow-emerald-900/30">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                    </svg>
                    İndirmeyi Başlat
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = "879d937f7a98707eecaf09ef6cdaccf8e37367fc";
        let targetDownloadUrl = "";

        // YouTube Video ID Çıkarıcı
        function extractYouTubeID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // Platform Algılayıcı
        function detectPlatform(url) {
            if (url.includes("youtube.com") || url.includes("youtu.be")) return "YouTube";
            if (url.includes("instagram.com")) return "Instagram";
            if (url.includes("tiktok.com")) return "TikTok";
            if (url.includes("twitter.com") || url.includes("x.com")) return "X (Twitter)";
            if (url.includes("facebook.com") || url.includes("fb.watch")) return "Facebook";
            return "Genel Medya";
        }

        async function fetchVideoData() {
            const input = document.getElementById('videoUrl').value.trim();
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const result = document.getElementById('result');
            const platformBadge = document.getElementById('platformBadge');
            const thumbImg = document.getElementById('thumb');

            if (!input.startsWith("http://") && !input.startsWith("https://")) {
                showError("Lütfen 'http://' veya 'https://' ile başlayan geçerli bir link girin.");
                return;
            }

            const platform = detectPlatform(input);
            const ytId = extractYouTubeID(input);

            // Eğer YouTube ise standart formata getir
            if (ytId) {
                targetDownloadUrl = `https://www.youtube.com/watch?v=${ytId}`;
                thumbImg.src = `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`;
            } else {
                targetDownloadUrl = input;
                // Varsayılan placeholder kapak resmi
                thumbImg.src = `https://placehold.co/300x200/334155/fff?text=${encodeURIComponent(platform)}`;
            }

            // Arayüzü Sıfırla
            error.classList.add('hidden');
            result.classList.add('hidden');
            loading.classList.remove('hidden');

            try {
                document.getElementById('title').innerText = `${platform} Bağlantısı Algılandı`;
                platformBadge.innerText = `Platform: ${platform}`;

                loading.classList.add('hidden');
                result.classList.remove('hidden');

            } catch (err) {
                loading.classList.add('hidden');
                showError("Bağlantı analiz edilirken sorun oluştu.");
                console.error(err);
            }
        }

        async function startDownload() {
            const format = document.getElementById('formatSelect').value;
            const btnDownload = document.getElementById('btnDownload');
            const error = document.getElementById('error');

            error.classList.add('hidden');
            btnDownload.disabled = true;
            btnDownload.innerText = "İndirme Bağlantısı Hazırlanıyor...";

            try {
                const encodedUrl = encodeURIComponent(targetDownloadUrl);
                const apiUrl = `https://p.savenow.to/api/v2/download?format=${format}&url=${encodedUrl}&apikey=${API_KEY}`;

                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data && (data.url || data.download_url)) {
                    const downloadUrl = data.url || data.download_url;
                    window.open(downloadUrl, '_blank');
                } else if (data && data.status === "processing") {
                    showError("Video işleniyor, lütfen birkaç saniye sonra tekrar indirmeyi deneyin.");
                } else {
                    throw new Error("İndirme bağlantısı alınamadı.");
                }

            } catch (err) {
                showError("İndirme başlatılamadı. İlgili platform bu içerik için erişim engeli koymuş olabilir veya link gizli bir hesaba aittir.");
                console.error(err);
            } finally {
                btnDownload.disabled = false;
                btnDownload.innerText = "İndirmeyi Başlat";
            }
        }

        function showError(msg) {
            const error = document.getElementById('error');
            error.innerText = msg;
            error.classList.remove('hidden');
        }
    </script>
</body>
</html>
